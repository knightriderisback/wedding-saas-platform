<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="540" height="1080">
  <defs>
    <!-- Paper Texture & Base Colors -->
    <linearGradient id="sageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#637558"/>
      <stop offset="50%" stop-color="#5B6C51"/>
      <stop offset="100%" stop-color="#4D5C43"/>
    </linearGradient>

    <!-- 3D Emboss Filter for botanical leaves: creates highlight on top-left, shadow on bottom-right -->
    <filter id="embossFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1.5" dy="-2" stdDeviation="1.2" flood-color="#A8BE9A" flood-opacity="0.6"/>
      <feDropShadow dx="2" dy="2.5" stdDeviation="1.8" flood-color="#273322" flood-opacity="0.75"/>
    </filter>

    <filter id="goldShine">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Olive Leaf Definition -->
    <g id="oliveLeaf" filter="url(#embossFilter)">
      <path d="M 0,0 C -8,-25 -4,-45 0,-60 C 4,-45 8,-25 0,0 Z" fill="#58694E" stroke="#697C5E" stroke-width="0.5"/>
      <path d="M 0,-5 C 0,-25 0,-45 0,-55" stroke="#4A5A41" stroke-width="0.8" fill="none"/>
      <path d="M 0,-20 C -3,-24 -5,-26 -5,-27" stroke="#4A5A41" stroke-width="0.5" fill="none"/>
      <path d="M 0,-30 C 3,-34 5,-36 5,-37" stroke="#4A5A41" stroke-width="0.5" fill="none"/>
      <path d="M 0,-40 C -3,-44 -4,-46 -4,-47" stroke="#4A5A41" stroke-width="0.5" fill="none"/>
    </g>

    <!-- Olive Cluster -->
    <g id="oliveCluster" filter="url(#embossFilter)">
      <ellipse cx="-5" cy="-15" rx="5" ry="7" fill="#4E5E45" stroke="#697C5E" stroke-width="0.5" transform="rotate(-15, -5, -15)"/>
      <ellipse cx="6" cy="-10" rx="4.5" ry="6.5" fill="#46543D" stroke="#697C5E" stroke-width="0.5" transform="rotate(20, 6, -10)"/>
    </g>

    <!-- Foliage Branch -->
    <g id="botanicalBranch">
      <path d="M 0,0 C 30,80 80,180 140,260 C 180,315 230,360 290,400" fill="none" stroke="#4B5B42" stroke-width="2.5" stroke-linecap="round" filter="url(#embossFilter)"/>
      <!-- Leaves along branch -->
      <use href="#oliveLeaf" transform="translate(50, 110) rotate(-45) scale(0.85)"/>
      <use href="#oliveLeaf" transform="translate(65, 135) rotate(45) scale(0.75)"/>
      <use href="#oliveCluster" transform="translate(80, 160)"/>
      <use href="#oliveLeaf" transform="translate(100, 195) rotate(-30) scale(0.95)"/>
      <use href="#oliveLeaf" transform="translate(115, 215) rotate(55) scale(0.85)"/>
      <use href="#oliveLeaf" transform="translate(150, 270) rotate(-40) scale(1.1)"/>
      <use href="#oliveLeaf" transform="translate(170, 290) rotate(50) scale(0.9)"/>
      <use href="#oliveCluster" transform="translate(190, 320)"/>
      <use href="#oliveLeaf" transform="translate(215, 345) rotate(-25) scale(1.05)"/>
      <use href="#oliveLeaf" transform="translate(245, 370) rotate(40) scale(0.85)"/>
      <use href="#oliveLeaf" transform="translate(290, 400) rotate(20) scale(1)"/>
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#sageGradient)"/>

  <!-- Subtle Paper Stipple Grain -->
  <rect width="100%" height="100%" fill="#000000" opacity="0.04" style="mix-blend-mode: overlay;"/>

  <!-- Top-Left Foliage Spray -->
  <g transform="translate(-40, -30) scale(1.1)">
    <use href="#botanicalBranch"/>
  </g>
  <g transform="translate(20, -50) scale(0.85) rotate(25)">
    <use href="#botanicalBranch"/>
  </g>

  <!-- Bottom-Left Foliage Spray (Reaching Upward) -->
  <g transform="translate(-30, 1110) scale(1.1, -1)">
    <use href="#botanicalBranch"/>
  </g>
  <g transform="translate(30, 1130) scale(0.85, -0.85) rotate(25)">
    <use href="#botanicalBranch"/>
  </g>

  <!-- Outer Side Branch (Reaching inward) -->
  <g transform="translate(-60, 500) scale(0.9) rotate(-15)">
    <use href="#botanicalBranch"/>
  </g>
</svg>