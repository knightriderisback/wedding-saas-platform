<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="540" height="1080">
  <defs>
    <!-- Authentic Light Sage Luxury Paper Gradient -->
    <linearGradient id="sageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93A884"/>
      <stop offset="50%" stop-color="#869B77"/>
      <stop offset="100%" stop-color="#788D69"/>
    </linearGradient>

    <!-- 3D Paper Emboss Filter: Highlight on Top-Left, Soft Deep Shadow on Bottom-Right -->
    <filter id="embossFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="-2.5" stdDeviation="1.5" flood-color="#D4E6C8" flood-opacity="0.85"/>
      <feDropShadow dx="2.5" dy="3" stdDeviation="2" flood-color="#415335" flood-opacity="0.65"/>
    </filter>

    <!-- Single Olive Leaf -->
    <g id="leaf" filter="url(#embossFilter)">
      <path d="M 0,0 C -9,-26 -5,-48 0,-62 C 5,-48 9,-26 0,0 Z" fill="#809571" stroke="#8CA37D" stroke-width="0.8"/>
      <path d="M 0,-4 C 0,-25 0,-45 0,-56" stroke="#5E7450" stroke-width="0.9" fill="none"/>
      <path d="M 0,-18 C -3,-22 -5,-25 -5,-26" stroke="#5E7450" stroke-width="0.5" fill="none"/>
      <path d="M 0,-28 C 3,-32 5,-35 5,-36" stroke="#5E7450" stroke-width="0.5" fill="none"/>
      <path d="M 0,-38 C -3,-42 -4,-45 -4,-46" stroke="#5E7450" stroke-width="0.5" fill="none"/>
    </g>

    <!-- Olive Cluster -->
    <g id="cluster" filter="url(#embossFilter)">
      <ellipse cx="-4" cy="-14" rx="5" ry="7" fill="#6A805B" stroke="#7C946D" stroke-width="0.5" transform="rotate(-15, -4, -14)"/>
      <ellipse cx="6" cy="-9" rx="4.5" ry="6.5" fill="#607651" stroke="#7C946D" stroke-width="0.5" transform="rotate(20, 6, -9)"/>
    </g>

    <!-- Botanical Olive Branch -->
    <g id="branch">
      <path d="M 0,0 C 25,70 70,150 120,220 C 160,270 210,310 270,350" fill="none" stroke="#5E7450" stroke-width="2.5" stroke-linecap="round" filter="url(#embossFilter)"/>
      <use href="#leaf" transform="translate(45, 95) rotate(-45) scale(0.9)"/>
      <use href="#leaf" transform="translate(60, 120) rotate(45) scale(0.8)"/>
      <use href="#cluster" transform="translate(75, 145)"/>
      <use href="#leaf" transform="translate(95, 175) rotate(-30) scale(1)"/>
      <use href="#leaf" transform="translate(110, 195) rotate(55) scale(0.85)"/>
      <use href="#leaf" transform="translate(140, 240) rotate(-40) scale(1.1)"/>
      <use href="#leaf" transform="translate(160, 260) rotate(50) scale(0.9)"/>
      <use href="#cluster" transform="translate(180, 285)"/>
      <use href="#leaf" transform="translate(205, 310) rotate(-25) scale(1.05)"/>
      <use href="#leaf" transform="translate(235, 330) rotate(40) scale(0.85)"/>
      <use href="#leaf" transform="translate(270, 350) rotate(20) scale(1)"/>
    </g>
  </defs>

  <!-- Background Base Paper -->
  <rect width="100%" height="100%" fill="url(#sageGradient)"/>

  <!-- Subtle Paper Fiber Grain Overlay -->
  <rect width="100%" height="100%" fill="#FFFFFF" opacity="0.03"/>

  <!-- Top Foliage Spray (Cascading Downward Matching Video f_0004.jpg) -->
  <g transform="translate(-20, -20) scale(1.05)">
    <use href="#branch"/>
  </g>
  <g transform="translate(60, -40) scale(0.85) rotate(30)">
    <use href="#branch"/>
  </g>

  <!-- Middle Leaf Cluster -->
  <g transform="translate(-40, 480) scale(0.85) rotate(-15)">
    <use href="#branch"/>
  </g>

  <!-- Bottom Foliage Spray (Reaching Upward Matching Video f_0004.jpg) -->
  <g transform="translate(-20, 1100) scale(1.05, -1.05)">
    <use href="#branch"/>
  </g>
  <g transform="translate(50, 1120) scale(0.8, -0.8) rotate(30)">
    <use href="#branch"/>
  </g>
</svg>
