<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <!-- Gold Foil Gradients -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0D2"/>
      <stop offset="20%" stop-color="#D4AF37"/>
      <stop offset="40%" stop-color="#AA7C28"/>
      <stop offset="60%" stop-color="#FDE08B"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C631B"/>
    </linearGradient>
    <linearGradient id="goldFoilLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#9E7422"/>
    </linearGradient>
    <radialGradient id="parchmentBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="70%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#EFE5D0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="embossBevel">
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.5" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="1.5" dy="2" stdDeviation="1" flood-color="#5A4010" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Drop Shadow Group -->
  <g filter="url(#dropShadow)">
    <!-- Main Cartouche Path: Symmetrical Rococo Baroque Lobed Shield -->
    <path d="
      M 180,18
      C 198,18 215,28 226,38
      C 235,46 242,54 250,52
      C 260,50 268,40 278,44
      C 290,49 292,65 288,78
      C 285,88 276,96 280,106
      C 285,118 300,125 312,136
      C 328,150 338,172 338,196
      C 338,214 330,228 322,240
      C 330,252 338,266 338,284
      C 338,308 328,330 312,344
      C 300,355 285,362 280,374
      C 276,384 285,392 288,402
      C 292,415 290,431 278,436
      C 268,440 260,430 250,428
      C 242,426 235,434 226,442
      C 215,452 198,462 180,462
      C 162,462 145,452 134,442
      C 125,434 118,426 110,428
      C 100,430 92,440 82,436
      C 70,431 68,415 72,402
      C 75,392 84,384 80,374
      C 75,362 60,355 48,344
      C 32,330 22,308 22,284
      C 22,266 30,252 38,240
      C 30,228 22,214 22,196
      C 22,172 32,150 48,136
      C 60,125 75,118 80,106
      C 84,96 75,88 72,78
      C 68,65 70,49 82,44
      C 92,40 100,50 110,52
      C 118,54 125,46 134,38
      C 145,28 162,18 180,18
      Z
    " fill="url(#parchmentBg)" stroke="url(#goldFoil)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Inner Filigree Border -->
    <path d="
      M 180,32
      C 195,32 208,40 217,49
      C 228,59 238,64 249,60
      C 260,56 268,64 268,76
      C 268,88 259,98 264,110
      C 270,124 286,134 296,146
      C 310,161 318,180 318,200
      C 318,218 308,232 300,240
      C 308,248 318,262 318,280
      C 318,300 310,319 296,334
      C 286,346 270,356 264,370
      C 259,382 268,392 268,404
      C 268,416 260,424 249,420
      C 238,416 228,421 217,431
      C 208,440 195,448 180,448
      C 165,448 152,440 143,431
      C 132,421 122,416 111,420
      C 100,424 92,416 92,404
      C 92,392 101,382 96,370
      C 90,356 74,346 64,334
      C 50,319 42,300 42,280
      C 42,262 52,248 60,240
      C 52,232 42,218 42,200
      C 42,180 50,161 64,146
      C 74,134 90,124 96,110
      C 101,98 92,88 92,76
      C 92,64 100,56 111,60
      C 122,64 132,59 143,49
      C 152,40 165,32 180,32
      Z
    " fill="none" stroke="url(#goldFoil)" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85" />
  </g>

  <!-- Decorative Botanical Branch (Top) -->
  <g transform="translate(180, 115) scale(0.9)" filter="url(#embossBevel)">
    <path d="M 0,-30 C -2,-10 -2,10 0,30" stroke="url(#goldFoilLight)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 0,-25 C -10,-32 -16,-24 0,-15 C 16,-24 10,-32 0,-25 Z" fill="url(#goldFoilLight)"/>
    <path d="M 0,-10 C -14,-15 -18,-5 -2,-2 C 14,-5 10,-15 0,-10 Z" fill="url(#goldFoilLight)"/>
    <path d="M 0,5 C -15,2 -18,12 -2,15 C 14,12 10,2 0,5 Z" fill="url(#goldFoilLight)"/>
    <circle cx="0" cy="28" r="2.5" fill="url(#goldFoilLight)"/>
  </g>

  <!-- Thin Horizontal Divider Top -->
  <g transform="translate(180, 185)">
    <line x1="-75" y1="0" x2="-12" y2="0" stroke="url(#goldFoil)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#goldFoil)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFDF9"/>
    <line x1="12" y1="0" x2="75" y2="0" stroke="url(#goldFoil)" stroke-width="1.2"/>
  </g>

  <!-- Centered Serif Text: TAP TO OPEN -->
  <text x="180" y="246"
        font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', serif"
        font-size="22"
        font-weight="600"
        letter-spacing="6.5"
        text-anchor="middle"
        fill="url(#goldFoilLight)"
        filter="url(#embossBevel)">
    TAP TO OPEN
  </text>

  <!-- Thin Horizontal Divider Bottom -->
  <g transform="translate(180, 295)">
    <line x1="-75" y1="0" x2="-12" y2="0" stroke="url(#goldFoil)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#goldFoil)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFDF9"/>
    <line x1="12" y1="0" x2="75" y2="0" stroke="url(#goldFoil)" stroke-width="1.2"/>
  </g>

  <!-- Decorative Botanical Branch (Bottom, Inverted) -->
  <g transform="translate(180, 365) scale(0.9, -0.9)" filter="url(#embossBevel)">
    <path d="M 0,-30 C -2,-10 -2,10 0,30" stroke="url(#goldFoilLight)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 0,-25 C -10,-32 -16,-24 0,-15 C 16,-24 10,-32 0,-25 Z" fill="url(#goldFoilLight)"/>
    <path d="M 0,-10 C -14,-15 -18,-5 -2,-2 C 14,-5 10,-15 0,-10 Z" fill="url(#goldFoilLight)"/>
    <path d="M 0,5 C -15,2 -18,12 -2,15 C 14,12 10,2 0,5 Z" fill="url(#goldFoilLight)"/>
    <circle cx="0" cy="28" r="2.5" fill="url(#goldFoilLight)"/>
  </g>
</svg>